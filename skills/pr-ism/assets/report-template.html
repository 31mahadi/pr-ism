<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__PRISM_TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F5F8;--surface:#FFFFFF;--ink:#172033;--muted:#62708A;--line:#DCE2EA;--line-strong:#B9C3D1;--accent:#2757D6;--accent-ink:#FFFFFF;
  --green:#1F8B4D;--amber:#C47A00;--red:#C43030;--green-soft:#E3F3E9;--amber-soft:#FBF0DC;--red-soft:#FBE3E3;--hover:#EEF2F7;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121721;--surface:#1A2130;--ink:#E6EBF2;--muted:#8B97AB;--line:#2A3446;--line-strong:#3C4A60;--accent:#7FA3FF;--accent-ink:#0E1420;--green:#4CC479;--amber:#F0B34A;--red:#F07272;--green-soft:#173627;--amber-soft:#3A2C10;--red-soft:#3D1D1D;--hover:#202A3B}}
:root[data-theme="dark"]{--bg:#121721;--surface:#1A2130;--ink:#E6EBF2;--muted:#8B97AB;--line:#2A3446;--line-strong:#3C4A60;--accent:#7FA3FF;--accent-ink:#0E1420;--green:#4CC479;--amber:#F0B34A;--red:#F07272;--green-soft:#173627;--amber-soft:#3A2C10;--red-soft:#3D1D1D;--hover:#202A3B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
code,.mono{font-family:var(--mono);font-size:.92em}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line-strong);border-radius:4px;padding:3px 9px;cursor:pointer}
button:hover{background:var(--hover)}button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);background:var(--surface);position:sticky;top:0;height:100vh;overflow:auto;padding:20px 14px}
.rail h2{font-size:12px;font-weight:600;color:var(--muted);margin:0 6px 8px;letter-spacing:.02em}
.rail ol{list-style:none;margin:0 0 18px;padding:0}
.rail li a{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;padding:4px 6px;border-radius:4px;color:var(--ink);font-size:13px}
.rail li a:hover{background:var(--hover);text-decoration:none}
.rail .path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12px}
.rail .delta{color:var(--muted);font-size:11px;font-family:var(--mono)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--muted)}
.dot.green{background:var(--green)}.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}
.rail .jump{display:block;padding:4px 6px;color:var(--muted);font-size:13px}
main{padding:28px 40px 80px;max-width:1280px}
header .title{font-size:22px;font-weight:600;line-height:1.3;margin:0 0 6px}
header .meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 14px}
header .meta a{color:inherit}
.verdict{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;border:1.5px solid currentColor;margin-left:8px;vertical-align:middle}
.verdict.approve{color:var(--green)}.verdict.comment{color:var(--amber)}.verdict.request-changes{color:var(--red)}
.spectrum{margin:26px 0 8px}
.spectrum .bar{display:flex;height:34px;border-radius:6px;overflow:hidden;background:var(--line)}
.spectrum .seg{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px;border:0;padding:0;border-radius:0;cursor:pointer;transition:filter .12s;min-width:0}
.spectrum .seg.green{background:var(--green)}.spectrum .seg.amber{background:var(--amber)}.spectrum .seg.red{background:var(--red)}
.spectrum .seg[aria-pressed="true"]{filter:brightness(1.15);box-shadow:inset 0 0 0 2px #fff}
.spectrum .seg:hover{filter:brightness(1.08)}
.spectrum .legend{display:flex;gap:18px;color:var(--muted);font-size:13px;margin-top:8px;flex-wrap:wrap}
.spectrum .legend b{color:var(--ink);font-weight:600}
.stats{display:flex;gap:22px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:6px 0 0}
.stats b{color:var(--ink);font-weight:500}
section{margin-top:36px}
section>h2{font-size:15px;font-weight:600;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.summary p{max-width:72ch;margin:0 0 10px}
.summary .one{font-size:17px;font-weight:500;max-width:72ch}
.themes{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.themes span{font-size:12px;border:1px solid var(--line-strong);border-radius:4px;padding:1px 8px;color:var(--muted)}
.risk ul{margin:0;padding-left:18px;max-width:80ch}.risk li{margin:3px 0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.toolbar input,.toolbar select{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);color:var(--ink)}
.toolbar input{min-width:240px}
.toolbar .count{color:var(--muted);font-size:13px;margin-left:auto}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);border:1px solid var(--line)}
th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line-strong);position:sticky;top:0;background:var(--surface);z-index:1}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}tr.row:hover td{background:var(--hover)}tr.row.active td{background:var(--hover)}
tr.group td{background:var(--bg);font-weight:600;font-size:12px;padding:9px 10px;border-top:1px solid var(--line-strong)}
tr.group .path{font-family:var(--mono);font-weight:500}
tr.group .sub{color:var(--muted);font-weight:400;margin-left:10px}
td.file,td.function{font-family:var(--mono);font-size:12px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
td.what{max-width:420px}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:3px;white-space:nowrap}
.chip.green{background:var(--green-soft);color:var(--green)}.chip.amber{background:var(--amber-soft);color:var(--amber)}.chip.red{background:var(--red-soft);color:var(--red)}
.chip.sev{border:1px solid var(--line-strong);color:var(--muted);font-weight:500}
.chip.sev.high,.chip.sev.critical{color:var(--red);border-color:var(--red)}.chip.sev.medium{color:var(--amber);border-color:var(--amber)}
.chip.v{border:1px solid var(--line-strong);font-weight:500}
.chip.v.blocking,.chip.v.needs-changes{color:var(--red);border-color:var(--red)}.chip.v.question{color:var(--amber);border-color:var(--amber)}.chip.v.lgtm{color:var(--green);border-color:var(--green)}
.chip.ct{color:var(--muted);border:1px solid var(--line);font-weight:500}
tr.detail td{background:var(--bg);padding:12px 14px 14px 28px}
.detail .grid{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;max-width:90ch;font-size:13px}
.detail .grid dt{color:var(--muted);margin:0}.detail .grid dd{margin:0}
.detail pre{margin:8px 0 0;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow-x:auto;font:12px/1.45 var(--mono);max-height:360px}
.detail pre .add{color:var(--green)}.detail pre .del{color:var(--red)}
.detail .links{margin-top:10px;display:flex;gap:14px;font-size:13px}
.findings ol{margin:0;padding-left:20px}.findings li{margin:0 0 12px;max-width:90ch}
.findings .t{font-weight:600}.findings .d{margin:2px 0}.findings .s{color:var(--muted)}.findings .loc{font-family:var(--mono);font-size:12px;color:var(--muted)}
.plain ul{margin:0;padding-left:20px;max-width:90ch}.plain li{margin:3px 0}
.empty{color:var(--muted);font-size:13px}
kbd{font:11px var(--mono);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--muted)}
.help{color:var(--muted);font-size:12px;margin-top:10px;line-height:2}
footer{color:var(--muted);font-size:12px;margin-top:48px;border-top:1px solid var(--line);padding-top:12px}
.hidden{display:none!important}
@media (max-width:900px){.layout{grid-template-columns:1fr}.rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:20px 16px 60px}.toolbar input{min-width:0;flex:1}td.what{max-width:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<script id="pr-ism-data" type="application/json">__PRISM_DATA__</script>
<div class="layout">
  <nav class="rail" aria-label="Files">
    <h2>Files in this change</h2>
    <ol id="file-nav"></ol>
    <h2>Sections</h2>
    <div id="section-nav"></div>
    <p class="help"><kbd>j</kbd>/<kbd>k</kbd> move · <kbd>↵</kbd> expand · <kbd>/</kbd> search · <kbd>t</kbd> theme</p>
  </nav>
  <main>
    <header>
      <h1 class="title" id="title"></h1>
      <div class="meta" id="meta"></div>
    </header>
    <div class="spectrum" id="spectrum"></div>
    <div class="stats" id="stats"></div>
    <section class="summary" id="sec-summary"><h2>Summary</h2><div id="summary"></div></section>
    <section class="risk" id="sec-risk_overview"><h2>Risk overview</h2><div id="risk"></div></section>
    <section id="sec-table">
      <h2>Changes by function</h2>
      <div class="toolbar">
        <input id="q" type="search" placeholder="Filter file, function, text…" aria-label="Filter rows">
        <select id="sev" aria-label="Minimum severity"><option value="">Any severity</option></select>
        <select id="group" aria-label="Group rows"><option value="file">Group by file</option><option value="severity">Group by severity</option><option value="logical">Group by logical change</option><option value="change_type">Group by change type</option><option value="none">No grouping</option></select>
        <button id="expand-all" type="button">Expand all</button>
        <button id="copy-md" type="button" title="Copy the visible rows + findings as a markdown PR comment">Copy as markdown</button>
        <span class="count" id="count"></span>
      </div>
      <div style="overflow-x:auto"><table id="table"><thead></thead><tbody></tbody></table></div>
    </section>
    <section class="findings" id="sec-findings"><h2>Findings</h2><div id="findings"></div></section>
    <section class="plain" id="sec-test_gaps"><h2>Test gaps</h2><div id="test_gaps"></div></section>
    <section class="plain" id="sec-questions"><h2>Questions for the author</h2><div id="questions"></div></section>
    <footer id="footer"></footer>
  </main>
</div>
<script>
(function(){
const D=JSON.parse(document.getElementById('pr-ism-data').textContent);
const cfg=D.render||{};const sections=cfg.sections||['summary','risk_overview','table','findings','test_gaps','questions'];
const columns=cfg.columns||['file','function','change_type','logical','what','verdict','severity'];
const sevScale=cfg.severity_scale||['info','low','medium','high','critical'];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs=new URLSearchParams(location.search);const state={rag:new Set(),sev:'',q:'',group:qs.get('group')||cfg.group_by||'file',open:new Set(),active:-1};
if(qs.get('theme'))document.documentElement.dataset.theme=qs.get('theme');
const rows=(D.rows||[]).map((r,i)=>Object.assign({_i:i},r));const F=D.findings||[],G=D.test_gaps||[],Q=D.questions||[];
const sevRank=s=>Math.max(0,sevScale.indexOf(String(s||'').toLowerCase()));
const ragRank={red:0,amber:1,green:2};
const link=(href,label,cls)=>href?`<a class="${cls||''}" href="${esc(href)}" title="${esc(href)}">${esc(label)}</a>`:`<span class="${cls||''}">${esc(label)}</span>`;

// header
document.getElementById('title').textContent=D.meta.title||'Pull request review';
document.title=(D.meta.title||'PR review')+' — pr-ism';
const m=D.meta,meta=[];
if(m.url)meta.push(`<a href="${esc(m.url)}">${esc(m.repo?m.repo+(m.number?' #'+m.number:''):m.url)}</a>`);else if(m.repo)meta.push(esc(m.repo));
if(m.author)meta.push('by '+esc(m.author));if(m.base&&m.head)meta.push(`<span class="mono">${esc(m.head)} → ${esc(m.base)}</span>`);
if(m.head_sha)meta.push(`<span class="mono">${esc(String(m.head_sha).slice(0,10))}</span>`);
const ov=(D.summary&&D.summary.overall_verdict)||'comment';const ovCls=ov.startsWith('approve')?'approve':ov==='request-changes'?'request-changes':'comment';
const ovLabel={'approve':'Approve','approve-with-nits':'Approve with nits','comment':'Comment','request-changes':'Request changes'}[ov]||ov;
document.getElementById('meta').innerHTML=meta.join('<span>·</span>')+`<span class="verdict ${ovCls}">${esc(ovLabel)}</span>`;

// spectrum + stats
const counts={green:0,amber:0,red:0};rows.forEach(r=>{counts[r.logical]=(counts[r.logical]||0)+1});
const total=rows.length||1;
document.getElementById('spectrum').innerHTML=`<div class="bar" role="group" aria-label="Logical change spectrum">${['green','amber','red'].map(k=>counts[k]?`<button class="seg ${k}" data-rag="${k}" aria-pressed="false" style="flex:${counts[k]} 1 0" title="${k}: ${counts[k]} change${counts[k]===1?'':'s'}">${counts[k]}</button>`:'').join('')}</div>
<div class="legend"><span><b>${counts.green}</b> green — no behaviour change</span><span><b>${counts.amber}</b> amber — intended behaviour change</span><span><b>${counts.red}</b> red — high blast radius or risky path</span><span style="margin-left:auto">click a segment to filter</span></div>`;
const st=(D.summary&&D.summary.stats)||{};
document.getElementById('stats').innerHTML=[['files',st.files],['functions',st.functions],['+',st.additions],['−',st.deletions],['findings',(D.findings||[]).length],['skipped',st.skipped]].filter(x=>x[1]!=null).map(x=>`<span><b>${esc(x[1])}</b> ${esc(x[0])}</span>`).join('');

// summary / risk
const S=D.summary||{};
document.getElementById('summary').innerHTML=(S.one_liner?`<p class="one">${esc(S.one_liner)}</p>`:'')+(S.narrative||[]).map(p=>`<p>${esc(p)}</p>`).join('')+((S.themes||[]).length?`<div class="themes">${S.themes.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:'');
const R=D.risk_overview||{};const riskItems=[];
[['Red paths touched','red_paths_touched'],['Breaking changes','breaking_changes'],['Migrations','migrations'],['Dependency changes','deps'],['Other risks','other']].forEach(([label,key])=>{(R[key]||[]).forEach(x=>riskItems.push(`<li><b>${esc(label)}:</b> ${esc(typeof x==='string'?x:(x.text||JSON.stringify(x)))}</li>`))});
document.getElementById('risk').innerHTML=riskItems.length?`<ul>${riskItems.join('')}</ul>`:'<p class="empty">Nothing risky stood out.</p>';

// file nav
const byFile={};rows.forEach(r=>{(byFile[r.file]=byFile[r.file]||[]).push(r)});
document.getElementById('file-nav').innerHTML=Object.keys(byFile).sort().map(f=>{const rs=byFile[f];const worst=rs.reduce((a,r)=>ragRank[r.logical]<ragRank[a]?r.logical:a,'green');const add=rs.reduce((a,r)=>a+(r.additions||0),0),del=rs.reduce((a,r)=>a+(r.deletions||0),0);return`<li><a href="#file-${esc(encodeURIComponent(f))}"><span class="dot ${worst}"></span><span class="path" title="${esc(f)}">${esc(f)}</span><span class="delta">${add||del?`+${add} −${del}`:rs.length}</span></a></li>`}).join('');
const secLabels={summary:'Summary',risk_overview:'Risk overview',table:'Changes by function',findings:'Findings',test_gaps:'Test gaps',questions:'Questions'};
document.getElementById('section-nav').innerHTML=sections.map(s=>`<a class="jump" href="#sec-${s}">${secLabels[s]||s}</a>`).join('');
['summary','risk_overview','table','findings','test_gaps','questions'].forEach(s=>{if(!sections.includes(s))document.getElementById('sec-'+s).classList.add('hidden')});
sevScale.slice().reverse().forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s[0].toUpperCase()+s.slice(1)+'+';document.getElementById('sev').appendChild(o)});
document.getElementById('group').value=state.group;

// table
const colLabel={file:'File',function:'Function',change_type:'Change',logical:'Logical',what:'What changed',why:'Why it matters',verdict:'Verdict',severity:'Severity',impact:'Impact',lines:'Lines'};
function cell(r,c){switch(c){
 case'file':return`<td class="file" title="${esc(r.file)}">${link(r.file_link,r.file)}</td>`;
 case'function':return`<td class="function" title="${esc(r.function||'')}">${link(r.line_link,r.function||'—')}</td>`;
 case'change_type':return`<td><span class="chip ct">${esc(r.change_type||'')}</span></td>`;
 case'logical':return`<td><span class="chip ${esc(r.logical)}">${esc(r.logical)}</span></td>`;
 case'what':return`<td class="what">${esc(r.what||'')}</td>`;
 case'why':return`<td class="what">${esc(r.why||'')}</td>`;
 case'verdict':return`<td><span class="chip v ${esc(r.verdict)}">${esc(r.verdict||'')}</span></td>`;
 case'severity':return`<td><span class="chip sev ${esc(r.severity)}">${esc(r.severity||'')}</span></td>`;
 case'impact':return`<td>${esc(r.impact||'')}</td>`;
 case'lines':return`<td class="mono">${r.line_start?esc(r.line_start)+(r.line_end&&r.line_end!==r.line_start?'–'+esc(r.line_end):''):''}</td>`;
 default:return`<td>${esc(r[c]==null?'':r[c])}</td>`}}
function detail(r){const pre=r.diff_snippet?`<pre>${r.diff_snippet.split('\n').map(l=>`<span class="${l[0]==='+'?'add':l[0]==='-'?'del':''}">${esc(l)}</span>`).join('\n')}</pre>`:'';
 const dl=[['Why it matters',r.why],['Notes',r.notes],['Suggestion',r.suggestion],['Impact',r.impact]].filter(x=>x[1]).map(x=>`<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join('');
 const links=[r.line_link?link(r.line_link,'Open at line '+(r.line_start||'')):'',r.review_link?link(r.review_link,'Open in review'):''].filter(Boolean).join('');
 return`<div class="detail"><dl class="grid">${dl||'<dt></dt><dd class="empty">No further notes.</dd>'}</dl>${pre}${links?`<div class="links">${links}</div>`:''}</div>`}
function visible(){const q=state.q.toLowerCase();return rows.filter(r=>(!state.rag.size||state.rag.has(r.logical))&&(!state.sev||sevRank(r.severity)>=sevRank(state.sev))&&(!q||[r.file,r.function,r.what,r.why,r.notes,r.change_type,r.verdict].join(' ').toLowerCase().includes(q)))}
function sorted(list){const s=cfg.sort||'severity_desc';const c=list.slice();if(s==='severity_desc')c.sort((a,b)=>sevRank(b.severity)-sevRank(a.severity)||ragRank[a.logical]-ragRank[b.logical]);else if(s==='severity_asc')c.sort((a,b)=>sevRank(a.severity)-sevRank(b.severity));else if(s==='logical')c.sort((a,b)=>ragRank[a.logical]-ragRank[b.logical]);else if(s==='file')c.sort((a,b)=>(a.file+a.line_start).localeCompare(b.file+b.line_start));return c}
function groupKey(r){return state.group==='none'?'':state.group==='severity'?r.severity:state.group==='logical'?r.logical:state.group==='change_type'?r.change_type:r.file}
function activeCols(){return state.group==='file'?columns.filter(c=>c!=='file'):columns}
function render(){const vis=visible();const cols=activeCols();document.querySelector('#table thead').innerHTML=`<tr>${cols.map(c=>`<th>${esc(colLabel[c]||c)}</th>`).join('')}</tr>`;const groups=new Map();sorted(vis).forEach(r=>{const k=groupKey(r);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)});
 let keys=[...groups.keys()];if(state.group==='file')keys.sort();else if(state.group==='severity')keys.sort((a,b)=>sevRank(b)-sevRank(a));else if(state.group==='logical')keys.sort((a,b)=>ragRank[a]-ragRank[b]);
 const html=[];keys.forEach(k=>{const rs=groups.get(k);if(state.group!=='none'){const worst=rs.reduce((a,r)=>ragRank[r.logical]<ragRank[a]?r.logical:a,'green');const first=rs[0];
  const label=state.group==='file'?`<span id="file-${esc(encodeURIComponent(k))}" class="path">${link(first.file_link,k)}</span>`:`<span class="chip ${state.group==='logical'?esc(k):state.group==='severity'?'sev '+esc(k):'ct'}">${esc(k)}</span>`;
  html.push(`<tr class="group"><td colspan="${cols.length}"><span class="dot ${worst}"></span>&nbsp; ${label}<span class="sub">${rs.length} change${rs.length===1?'':'s'}</span></td></tr>`)}
  rs.forEach(r=>{html.push(`<tr class="row${state.active===r._i?' active':''}" data-i="${r._i}" tabindex="0" aria-expanded="${state.open.has(r._i)}">${cols.map(c=>cell(r,c)).join('')}</tr>`);if(state.open.has(r._i))html.push(`<tr class="detail"><td colspan="${cols.length}">${detail(r)}</td></tr>`)})});
 document.querySelector('#table tbody').innerHTML=html.join('')||`<tr><td colspan="${cols.length}" class="empty">No changes match the current filters.</td></tr>`;
 document.getElementById('count').textContent=`${vis.length} of ${rows.length} changes`;
 document.querySelectorAll('.spectrum .seg').forEach(b=>b.setAttribute('aria-pressed',state.rag.has(b.dataset.rag)));
 document.getElementById('expand-all').textContent=state.open.size>=vis.length&&vis.length?'Collapse all':'Expand all'}
document.getElementById('spectrum').addEventListener('click',e=>{const b=e.target.closest('.seg');if(!b)return;const k=b.dataset.rag;state.rag.has(k)?state.rag.delete(k):state.rag.add(k);render()});
document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value;render()});
document.getElementById('sev').addEventListener('change',e=>{state.sev=e.target.value;render()});
document.getElementById('group').addEventListener('change',e=>{state.group=e.target.value;render()});
function toMarkdown(){const vis=sorted(visible());const e={green:'🟢',amber:'🟡',red:'🔴'};const out=[`**pr-ism review — ${ovLabel}**`,'',S.one_liner||'',''];
 (S.narrative||[]).forEach(p=>out.push(p,''));const cols=activeCols().filter(c=>!['lines'].includes(c));const head={file:'File',function:'Function',change_type:'Change',logical:'Logical',what:'What changed',why:'Why',verdict:'Verdict',severity:'Severity',impact:'Impact'};
 out.push('| '+cols.map(c=>head[c]||c).join(' | ')+' |','|'+cols.map(()=>'---').join('|')+'|');
 vis.forEach(r=>out.push('| '+cols.map(c=>{const v=c==='file'?(r.file_link?`[${r.file}](${r.file_link})`:r.file):c==='function'?(r.line_link?`[${r.function||'—'}](${r.line_link})`:(r.function||'—')):c==='logical'?`${e[r.logical]} ${r.logical}`:String(r[c]||'');return v.replace(/\|/g,'\\|').replace(/\n/g,' ')}).join(' | ')+' |'));
 if(F.length){out.push('','**Findings**');F.forEach(f=>out.push(`- **${f.severity}** — ${f.title}${f.file?` (\`${f.file}${f.line?':'+f.line:''}\`)`:''}${f.detail?': '+f.detail:''}${f.suggestion?` _Suggestion: ${f.suggestion}_`:''}`))}
 if(G.length){out.push('','**Test gaps**');G.forEach(g=>out.push(`- \`${g.file}\`${g.function?' · '+g.function:''} — ${g.reason}`))}
 if(Q.length){out.push('','**Questions**');Q.forEach(q=>out.push('- '+(typeof q==='string'?q:q.text)))}
 return out.join('\n')}
document.getElementById('copy-md').addEventListener('click',async()=>{const b=document.getElementById('copy-md');try{await navigator.clipboard.writeText(toMarkdown());b.textContent='Copied';setTimeout(()=>b.textContent='Copy as markdown',1500)}catch(err){const ta=document.createElement('textarea');ta.value=toMarkdown();document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();b.textContent='Copied';setTimeout(()=>b.textContent='Copy as markdown',1500)}});
document.getElementById('expand-all').addEventListener('click',()=>{const vis=visible();if(state.open.size>=vis.length&&vis.length)state.open.clear();else vis.forEach(r=>state.open.add(r._i));render()});
document.querySelector('#table tbody').addEventListener('click',e=>{if(e.target.closest('a'))return;const tr=e.target.closest('tr.row');if(!tr)return;const i=+tr.dataset.i;state.open.has(i)?state.open.delete(i):state.open.add(i);state.active=i;render()});
document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='select'){if(e.key==='Escape')e.target.blur();return}
 const vis=sorted(visible());const idx=vis.findIndex(r=>r._i===state.active);
 if(e.key==='j'||e.key==='k'){e.preventDefault();const n=e.key==='j'?Math.min(idx+1,vis.length-1):Math.max(idx-1,0);if(vis[n]){state.active=vis[n]._i;render();const el=document.querySelector(`tr.row[data-i="${state.active}"]`);el&&el.scrollIntoView({block:'nearest'});el&&el.focus()}}
 else if(e.key==='Enter'&&state.active>=0){e.preventDefault();state.open.has(state.active)?state.open.delete(state.active):state.open.add(state.active);render()}
 else if(e.key==='/'){e.preventDefault();document.getElementById('q').focus()}
 else if(e.key==='t'){const cur=document.documentElement.dataset.theme;document.documentElement.dataset.theme=cur==='dark'?'light':'dark'}});

// findings / gaps / questions
document.getElementById('findings').innerHTML=F.length?`<ol>${F.slice().sort((a,b)=>sevRank(b.severity)-sevRank(a.severity)).map(f=>`<li><span class="chip sev ${esc(f.severity)}">${esc(f.severity)}</span> <span class="t">${esc(f.title)}</span>${f.file?` <span class="loc">${link(f.link,f.file+(f.line?':'+f.line:''))}</span>`:''}<div class="d">${esc(f.detail||'')}</div>${f.suggestion?`<div class="s">Suggestion: ${esc(f.suggestion)}</div>`:''}</li>`).join('')}</ol>`:'<p class="empty">No findings beyond the per-function notes.</p>';
document.getElementById('test_gaps').innerHTML=G.length?`<ul>${G.map(g=>`<li><span class="mono">${esc(g.file)}${g.function?' · '+esc(g.function):''}</span> — ${esc(g.reason)}</li>`).join('')}</ul>`:'<p class="empty">No test gaps detected.</p>';
document.getElementById('questions').innerHTML=Q.length?`<ul>${Q.map(q=>`<li>${esc(typeof q==='string'?q:q.text)}</li>`).join('')}</ul>`:'<p class="empty">Nothing to ask.</p>';
document.getElementById('footer').textContent=`Generated ${m.generated_at||''} by ${m.reviewer||'pr-ism'}${m.config_hash?' · config '+m.config_hash:''}. Verdicts are a reviewer aid, not a gate.`;
if(qs.get('expand')==='all')rows.forEach(r=>state.open.add(r._i));
render();
})();
</script>
</body>
</html>
