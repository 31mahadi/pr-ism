name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Lint
        run: pipx run ruff check skills tests && pipx run ruff format --check skills tests
      - run: python3 tests/smoke_test.py

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build skill zip
        run: cd skills && zip -r ../pr-ism.skill.zip pr-ism -x '*/__pycache__/*'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pr-ism.skill.zip --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
